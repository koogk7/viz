<style>

  *{box-sizing:border-box;margin:0;padding:0}

  #deck{height:100vh;width:100vw;position:relative}
  .slide{position:absolute;inset:0;display:none;flex-direction:column;justify-content:center;padding:5.5vh 8vw;opacity:0;transition:opacity .2s}
  .slide.on{display:flex;opacity:1}
  .slide.center{align-items:center;text-align:center}
  .kicker{color:var(--accent);font-size:13px;font-weight:600;letter-spacing:1px;text-transform:uppercase;margin-bottom:11px}
  .cat{color:var(--muted);font-size:12px;letter-spacing:1px;margin-bottom:8px}

  ul{list-style:none;font-size:clamp(14px,1.8vw,20px);line-height:1.6;max-width:68ch}
  li{margin:8px 0;padding-left:24px;position:relative}
  li::before{content:"▸";position:absolute;left:0;color:var(--accent)}
  li small{color:var(--muted);font-size:.82em}
  code{background:#11161d;border:1px solid var(--line);border-radius:5px;padding:.06em .38em;font-size:.85em;font-family:ui-monospace,Menlo,monospace;color:var(--a2)}
  .src{color:var(--a2);font-size:.72em;font-weight:600;white-space:nowrap}
  .divider{background:linear-gradient(135deg,#141a22,#1a2230)}
  .num{font-size:clamp(40px,8vw,88px);font-weight:800;color:var(--line);line-height:1}
  .flagwrap{background:linear-gradient(135deg,#241c0f,#2a2210)}
  .flagbadge{display:inline-block;background:#3a2e12;border:1px solid #5c4a1a;color:var(--flag);border-radius:20px;padding:5px 15px;font-size:13px;font-weight:700;margin-bottom:14px}
  .qbox{background:var(--panel);border:1px solid var(--flag);border-left:4px solid var(--flag);border-radius:12px;padding:16px 20px;max-width:62ch;font-size:clamp(14px,1.85vw,19px);line-height:1.55;text-align:left}
  .casebox{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:11px 15px;margin:6px 0;max-width:70ch;font-size:clamp(13px,1.7vw,18px);line-height:1.5}

  .links{margin-top:10px;max-width:70ch}
  .links a{color:var(--a2);font-size:clamp(11px,1.4vw,15px);text-decoration:none;margin-right:14px;word-break:break-all}
  .foot{position:fixed;bottom:12px;left:0;right:0;display:flex;justify-content:space-between;padding:0 16px;font-size:11px;color:var(--muted);pointer-events:none}
  #bar{position:fixed;top:0;left:0;height:3px;background:var(--accent);transition:width .2s;z-index:10}
</style></head><body>

g: Lessons Learned the Hard Way", "https://www.infoq.com/articles/micro-batch-streaming-lessons-learned/"]]}, {"t": "flag", "cat": "설계 · 한 건 처리하기 vs 다 ", "h": "네 경험이 필요한 칸", "q": "당신이 토스증권에서 실제로 단건 → 다건(또는 반대) 처리로 전환했던 경험이 있다면 공유해 주세요. 어떤 계기로 전환했고, 전환 후 예상치 못한 복잡성이 어디서 터졌나요? (예: 부분 실패 처리, 멱등성, 재처리 로직 등)"}, {"t": "divider", "num": "23", "cat": "설계", "h": "순서와 병렬성(아카, 맵 리듀스)"}, {"t": "body", "cat": "설계 · 순서와 병렬성(아카, 맵 ", "kicker": "순서 vs 병렬성", "h": "<span class='hl'>순차 처리<\/span>의 한계와 <span class='hl'>병렬 분해<\/span>의 원리", "ul": ["순차 처리: 작업 N개 × 단위 시간 T → 총 <b>N·T<\/b> 소요, 단일 실패가 전체를 블록", "병렬 처리: 독립 작업을 쪼개 동시에 실행 → 이상적 시간 <b>T + 오버헤드<\/b>", "핵심 조건: <b>작업 간 의존성이 없어야<\/b> 병렬화 가능 (순서 보장 필요 구간은 순차 유지)", "아키텍처 패턴: <code>Fan-out → 병렬 실행 → Fan-in(Reduce)<\/code> = MapReduce의 본질"]}, {"t": "body", "cat": "설계 · 순서와 병렬성(아카, 맵 ", "kicker": "MapReduce 구조", "h": "<span class='hl'>Map<\/span>으로 분산, <span class='hl'>Shuffle+Reduce<\/span>로 집계", "ul": ["<b>Map<\/b>: 입력 데이터를 <code>key-value<\/code> 쌍으로 변환 — 워커 노드에 병렬 배포", "<b>Shuffle<\/b>: 같은 key끼리 같은 Reducer로 라우팅 — 네트워크 I/O 병목 구간", "<b>Reduce<\/b>: 같은 key의 values를 집계 → 최종 결과 생성", "현대 적용: Spark(in-memory), Flink(streaming), 마이크로서비스 <code>CompletableFuture.allOf()<\/code>"]}, {"t": "cases", "cat": "설계 · 순서와 병렬성(아카, 맵 ", "h": "📰 실제 사례", "cases": [["Google MapReduce — 웹 인덱스 빌드", "수천 대 머신이 수백 TB 웹 크롤 데이터를 Map(단어 추출)·Reduce(빈도 집계)로 처리. 단일 장비로 수개월 걸릴 인덱싱을 수 시간으로 단축했으며, 워커 장애 시 자동 재실행으로 내결함성을 확보했다. <span class='src'>Dean &amp; Ghemawat, OSDI&#x27;04 / ACM 2008<\/span>"], ["Netflix — 자산 메타데이터 재처리 파이프라인", "콘텐츠 자산 메타데이터를 새 유즈케이스에 맞게 재처리할 때, Kafka 메시지 브로커로 이벤트를 Fan-out하고 컨슈머 스레드 풀을 병렬 실행해 프로덕션 무중단으로 대규모 배치 재처리를 수행했다. <span class='src'>Netflix TechBlog, 2022 (netflixtechblog.com)<\/span>"], ["Netflix Muse — 조 단위 행 Spark 집계", "크리에이티브 인사이트 서비스에서 수조 행(trillion-row) 규모 데이터를 Spark Map-Reduce 파이프라인으로 처리. 파티셔닝 전략과 인메모리 셔플 최적화로 집계 지연을 서비스 SLA 이내로 유지했다. <span class='src'>Netflix TechBlog, 2024 (netflixtechblog.com)<\/span>"]], "links": [["MapReduce: Simplifi yteByteGo — How Netflix Stores 140M Hours of Viewing Data Per Day<\/span>"], ["Netflix — 분산 카운터 (Distributed Counter)", "\"좋아요\" 같은 고빈도 쓰기를 분당 버킷으로 파티셔닝해 Write-Heavy 병목 제거. 불변 윈도우(immutable window)가 닫힌 뒤에만 집계 — 이상감지용 최근 N분 슬라이딩 윈도우 쿼리와 분석용 OLAP 쿼리가 충돌하지 않도록 분리. <span class='src'>ByteByteGo — How Netflix Built a Distributed Counter for Billions of User Interactions<\/span>"], ["Microsoft — CQRS 패턴의 공식 Staleness 경고", "읽기 모델(Read Store)과 쓰기 모델(Write Store)을 분리하면 이벤트 전파 lag 때문에 읽기 결과가 최신 상태를 반영하지 못할 수 있음을 명시. \"사용자가 stale 데이터를 기반으로 요청을 보냈을 때 감지·처리하는 메커니즘\"을 설계하도록 권고. <span class='src'>Microsoft Learn — CQRS Pattern (Azure Architecture Center)<\/span>"]], "links": [["ByteByteGo — How Netflix Stores 140M Hours of Viewing Data Per Day", "https://blog.bytebytego.com/p/how-netflix-stores-140-million-hours"], ["ByteByteGo — How Netflix Built a Distributed Counter for Billions of User Interactions", "https://blog.bytebytego.com/p/how-netflix-built-a-distributed-counter"], ["Microsoft Learn — CQRS Pattern (Azure Architecture Center)", "https://learn.microsoft.com/en-us/azure/architecture/patterns/cqrs"]]}, {"t": "flag", "cat": "설계 · OLTP, OLAP, 이상", "h": "네 경험이 필요한 칸", "q": "토스증권에서 직접 겪은 staleness 사례가 있으면 공유해 주세요. 예를 들어, 체결 직후 잔고 조회가 레플리카 lag 때문에 이전 값을 내려줬던 상황, 또는 이상감지 쿼리가 OLTP Primary를 치는 바람에 장애로 번진 케이스 같은 것이요. 슬라이드의 \"실전 체험담\" 칸을 채울 수 있습니다."}, {"t": "divider", "num": "42", "cat": "설계", "h": "서비스 성격에 따라 카테고리화 하기"}, {"t": "body", "cat": "설계 · 서비스 성격에 따라 카테고", "kicker": "왜 분류가 먼저인가", "h": "서비스 성격이 다르면 <span class='hl'>설계 결정<\/span>도 달라진다", "ul": ["<b>Read-heavy vs Write-heavy<\/b>: 캐싱·레플리카 전략이 완전히 달라짐", "<b>Latency-sensitive vs Throughput-optimized<\/b>: 동기 API vs 비동기 배치 선택의 기준", "<b>Stateless vs Stateful<\/b>: 수평 확장 가능성과 장애 복구 비용의 차이", "분류 없이 설계하면 결제·조회·정산이 한 서버에서 서로 간섭한다"]}, {"t": "body", "cat": "설계 · 서비스 성격에 따라 카테고", "kicker": "4가지 분류 축", "h": "서비스를 <span class='hl'>4가지 축<\/span>으로 먼저 정의하라", "ul": ["<b>접근 패턴<\/b>: Read-heavy(전시/조회) / Write-heavy(주문/결제) — DB 레플리카·CQRS 분기점", "< deck.addEventListener('click',e=>{if(e.target.closest('a'))return;(e.clientX>innerWidth/2)?show(i+1):show(i-1)});
let x0=null;addEventListener('touchstart',e=>x0=e.touches[0].clientX,{passive:true});
addEventListener('touchend',e=>{if(x0===null)return;const dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>40){dx<0?show(i+1):show(i-1)}x0=null},{passive:true});
show(0);
</script></body></html>
