<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>결과보어 好 — 동작 완결 인터랙티브</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #23273a;
    --border: #2e3348;
    --text: #e2e6f0;
    --muted: #7b82a0;
    --accent: #6c8cff;
    --accent-glow: rgba(108,140,255,0.18);
    --green: #4ade80;
    --yellow: #facc15;
    --red: #f87171;
    --blue: #60a5fa;
    --orange: #fb923c;
    --success: #22c55e;
    --error: #ef4444;
    --radius: 10px;
    --radius-sm: 6px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 15px;
    line-height: 1.6;
    padding: 16px;
    max-width: 680px;
    margin: 0 auto;
  }
  h1 { font-size: 1.3rem; margin-bottom: 4px; color: #fff; }
  .subtitle { color: var(--muted); font-size: 0.85rem; margin-bottom: 24px; }
  h2 { font-size: 1rem; color: var(--accent); margin-bottom: 12px; letter-spacing: 0.01em; }

  /* ─── Tab Navigation ─── */
  .tabs { display: flex; gap: 6px; margin-bottom: 24px; flex-wrap: wrap; }
  .tab-btn {
    padding: 8px 16px; border-radius: 20px; border: 1px solid var(--border);
    background: var(--surface); color: var(--muted); cursor: pointer;
    font-size: 0.88rem; transition: all 0.15s;
  }
  .tab-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  /* ─── Section Card ─── */
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 20px; margin-bottom: 16px;
  }

  /* ─── Verb Builder ─── */
  .verb-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
  .verb-btn {
    padding: 10px 16px; border-radius: var(--radius-sm);
    border: 1px solid var(--border); background: var(--surface2);
    color: var(--text); cursor: pointer; font-size: 1.1rem;
    transition: all 0.15s; font-weight: 500;
  }
  .verb-btn:hover { border-color: var(--accent); color: var(--accent); }
  .verb-btn.selected { background: var(--accent-glow); border-color: var(--accent); color: var(--accent); }

  .result-box {
    background: var(--surface2); border-radius: var(--radius);
    padding: 20px; min-height: 120px;
  }
  .result-empty { color: var(--muted); text-align: center; padding: 24px 0; font-size: 0.9rem; }
  .verb-combo { display: flex; align-items: center; gap: 4px; margin-bottom: 12px; flex-wrap: wrap; }
  .combo-verb { font-size: 2rem; font-weight: 700; color: var(--text); }
  .combo-plus { font-size: 1.4rem; color: var(--muted); margin: 0 4px; }
  .combo-hao { font-size: 2rem; font-weight: 700; color: var(--accent); }
  .combo-eq { font-size: 1.2rem; color: var(--muted); margin: 0 8px; }
  .combo-result { font-size: 2rem; font-weight: 700; color: var(--accent); }

  .meaning-row { display: flex; gap: 16px; margin-top: 4px; flex-wrap: wrap; }
  .meaning-block { flex: 1; min-width: 140px; }
  .meaning-label { font-size: 0.75rem; color: var(--muted); margin-bottom: 4px; letter-spacing: 0.04em; text-transform: uppercase; }
  .meaning-before { color: var(--muted); font-size: 1rem; }
  .meaning-arrow { color: var(--muted); margin: 0 6px; }
  .meaning-after { color: var(--green); font-size: 1rem; font-weight: 600; }
  .pinyin-row { display: flex; gap: 16px; margin-top: 10px; flex-wrap: wrap; }
  .pinyin-block { flex: 1; min-width: 140px; }
  .pinyin { font-size: 0.9rem; color: var(--muted); font-style: italic; }
  .example-row { margin-top: 12px; border-top: 1px solid var(--border); padding-top: 12px; }
  .example-label { font-size: 0.75rem; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.04em; }
  .example-pos { color: var(--green); font-size: 0.95rem; margin-bottom: 4px; }
  .example-neg { color: var(--orange); font-size: 0.95rem; margin-bottom: 4px; }
  .example-ko { color: var(--muted); font-size: 0.85rem; }

  /* ─── Tone Colors ─── */
  .t1 { color: var(--blue); }
  .t2 { color: var(--green); }
  .t3 { color: var(--yellow); }
  .t4 { color: var(--red); }
  .tn { color: var(--muted); }

  /* ─── 想 Complement Cards ─── */
  .comp-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  @media (max-width: 440px) { .comp-grid { grid-template-columns: 1fr; } }
  .comp-card {
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px; cursor: pointer;
    transition: all 0.15s; user-select: none;
  }
  .comp-card:hover { border-color: var(--accent); }
  .comp-card.expanded { border-color: var(--accent); }
  .comp-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px; }
  .comp-zh { font-size: 1.6rem; font-weight: 700; }
  .comp-py { font-size: 0.85rem; color: var(--muted); font-style: italic; }
  .comp-ko-short { font-size: 0.9rem; color: var(--green); }
  .comp-detail { display: none; margin-top: 10px; border-top: 1px solid var(--border); padding-top: 10px; }
  .comp-card.expanded .comp-detail { display: block; }
  .comp-mech { font-size: 0.85rem; color: var(--muted); margin-bottom: 8px; }
  .comp-example { font-size: 0.9rem; color: var(--text); margin-bottom: 3px; }
  .comp-example-ko { font-size: 0.82rem; color: var(--muted); margin-bottom: 8px; }
  .tap-hint { font-size: 0.75rem; color: var(--muted); text-align: center; margin-top: 8px; }

  /* ─── Quiz ─── */
  .quiz-card {
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 20px; margin-bottom: 12px;
  }
  .quiz-q { font-size: 1rem; margin-bottom: 14px; font-weight: 500; }
  .quiz-q .ko { color: var(--accent); }
  .options { display: flex; flex-direction: column; gap: 8px; }
  .opt-btn {
    padding: 10px 14px; border-radius: var(--radius-sm);
    border: 1px solid var(--border); background: var(--surface);
    color: var(--text); cursor: pointer; text-align: left;
    font-size: 0.95rem; transition: all 0.15s;
  }
  .opt-btn:hover:not([disabled]) { border-color: var(--accent); }
  .opt-btn.correct { background: rgba(34,197,94,0.15); border-color: var(--success); color: var(--success); }
  .opt-btn.wrong { background: rgba(239,68,68,0.12); border-color: var(--error); color: var(--error); }
  .opt-btn[disabled] { cursor: default; }
  .explanation {
    display: none; margin-top: 12px; padding: 12px;
    background: var(--surface); border-radius: var(--radius-sm);
    font-size: 0.88rem; line-height: 1.6;
  }
  .explanation.show { display: block; }
  .explanation .key { color: var(--accent); font-weight: 600; }
  .quiz-progress { color: var(--muted); font-size: 0.82rem; margin-bottom: 16px; }
  .quiz-score {
    text-align: center; padding: 20px; font-size: 1.1rem;
    display: none; background: var(--surface2); border-radius: var(--radius);
    border: 1px solid var(--border);
  }
  .quiz-score.show { display: block; }
  .score-num { font-size: 2rem; font-weight: 700; color: var(--accent); }
  .reset-btn {
    margin-top: 12px; padding: 10px 24px; border-radius: 20px;
    border: 1px solid var(--accent); background: transparent;
    color: var(--accent); cursor: pointer; font-size: 0.9rem;
  }
  .reset-btn:hover { background: var(--accent-glow); }
</style>
</head>
<body>

<h1>결과보어 好</h1>
<p class="subtitle">동사 + 好 = 동작이 완결·확정 상태에 도달</p>

<div class="tabs">

<!-- ══════════════ TAB 2: 想 COMPLEMENTS ══════════════ -->

  <div class="comp-grid" id="compGrid"></div>

<!-- ══════════════ TAB 3: QUIZ ══════════════ -->

  <div id="quizScore" class="quiz-score">

    <button class="reset-btn" onclick="resetQuiz()">다시 풀기</button>
  </div>
</div>

    'ī':'<span class="t1">ī</span>','í':'<span class="t2">í</span>','ǐ':'<span class="t3">ǐ</span>','ì':'<span class="t4">ì</span>',
    'ō':'<span class="t1">ō</span>','ó':'<span class="t2">ó</span>','ǒ':'<span class="t3">ǒ</span>','ò':'<span class="t4">ò</span>',
    'ū':'<span class="t1">ū</span>','ú':'<span class="t2">ú</span>','ǔ':'<span class="t3">ǔ</span>','ù':'<span class="t4">ù</span>',
    'ǖ':'<span class="t1">ǖ</span>','ǘ':'<span class="t2">ǘ</span>','ǚ':'<span class="t3">ǚ</span>','ǜ':'<span class="t4">ǜ</span>',
  };
  return py.split('').map(c => toneMap[c] || c).join('');
}

// ─── TAB LOGIC ───────────────────────────────────────────

function switchTab(name) {
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  event.target.classList.add('active');
}

// ─── BUILDER ─────────────────────────────────────────────

let selectedVerb = null;

function renderBuilder() {
  const grid = document.getElementById('verbGrid');
  grid.innerHTML = '';
  verbs.forEach((v, i) => {
    const btn = document.createElement('button');
    btn.className = 'verb-btn';
    btn.innerHTML = `<span style="font-size:1.1rem">${v.zh}</span> <span style="font-size:0.75rem;color:var(--muted);display:block">${v.ko}</span>`;
    btn.onclick = () => selectVerb(i, btn);
    grid.appendChild(btn);
  });
}

function selectVerb(i, btn) {
  document.querySelectorAll('.verb-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  selectedVerb = verbs[i];
  const v = verbs[i];
  const box = document.getElementById('resultBox');
  box.innerHTML = `
    <div class="verb-combo">
      <span class="combo-verb">${v.zh}</span>
      <span class="combo-plus">+</span>
      <span class="combo-hao">好</span>
      <span class="combo-eq">=</span>
      <span class="combo-result">${v.zh}好</span>
    </div>
    <div class="pinyin-row">
      <div class="pinyin-block">
        <div class="meaning-label">없을 때</div>
        <div class="pinyin">${pinyin2html(v.py)}</div>
      </div>
      <div class="pinyin-block">
        <div class="meaning-label">好 결합</div>
        <div class="pinyin">${pinyin2html(v.combo_py)}</div>
      </div>
    </div>
    <div class="meaning-row" style="margin-top:10px">
      <div class="meaning-block">
        <div class="meaning-label">동사만</div>
        <div class="meaning-before">${v.before_ko}</div>
      </div>
      <div class="meaning-block">
        <div class="meaning-label">+好 결과</div>
        <div class="meaning-after">${v.after_ko}</div>
      </div>
    </div>
    <div style="margin-top:10px;font-size:0.82rem;color:var(--muted)">${v.mech}</div>
    <div class="example-row">
      <div class="example-label">예문</div>
      <div class="example-pos">✅ ${v.ex_pos} <span style="color:var(--muted);font-size:0.82rem">— ${v.ex_pos_ko}</span></div>
      <div class="example-neg">⏳ ${v.ex_neg} <span style="color:var(--muted);font-size:0.82rem">— ${v.ex_neg_ko}</span></div>
    </div>
  `;
}

// ─── COMPLEMENTS ─────────────────────────────────────────

function renderComplements() {
  const grid = document.getElementById('compGrid');
  grid.innerHTML = '';
  complements.forEach((c, i) => {
    const card = document.createElement('div');
    card.className = 'comp-card';
    card.innerHTML = `
      <div class="comp-head">
        <span class="comp-zh">${c.combo}</span>
        <span class="comp-py">${pinyin2html(c.py)}</span>
      </div>
      <div class="comp-ko-short">${c.ko_short}</div>
      <div class="comp-detail">
        <div class="comp-mech">${c.mech}</div>
        <div class="comp-example">${c.example}</div>
        <div class="comp-example-ko">${c.example_ko}</div>
        <div class="comp-example">${c.example2}</div>
        <div class="comp-example-ko">${c.example2_ko}</div>
      </div>
    `;
    card.onclick = () => card.classList.toggle('expanded');
    grid.appendChild(card);
  });
  const hint = document.createElement('p');
  hint.className = 'tap-hint';
  hint.textContent = '카드를 탭하면 상세 정보가 펼쳐져요';
  grid.after(hint);
}

// ─── QUIZ ────────────────────────────────────────────────

let quizState = { cur: 0, score: 0, answered: new Array(quizzes.length).fill(false) };

function renderQuiz() {
  const container = document.getElementById('quizContainer');
  const prog = document.getElementById('quizProgress');
  const done = quizState.answered.filter(Boolean).length;
  prog.textContent = `${done} / ${quizzes.length} 완료`;
  container.innerHTML = '';

  quizzes.forEach((q, qi) => {
    const card = document.createElement('div');
    card.className = 'quiz-card';
    const answered = quizState.answered[qi];
    card.innerHTML = `
      <div class="quiz-q">Q${qi+1}. <span class="ko">${q.q}</span>
        ${q.hint ? `<div style="font-size:0.8rem;color:var(--muted);margin-top:4px">힌트: ${q.hint}</div>` : ''}
      </div>
      <div class="options">
        ${q.opts.map((opt, oi) => `
          <button class="opt-btn${answered ? (oi===q.ans?' correct':' wrong') : ''}"
            id="opt-${qi}-${oi}"
            ${answered ? 'disabled' : ''}
            onclick="answerQuiz(${qi},${oi})">
            ${opt}
          </button>
        `).join('')}
      </div>
      <div class="explanation${answered ? ' show' : ''}" id="exp-${qi}">
        ${q.exp}
      </div>
    `;
    container.appendChild(card);
  });

  const score = document.getElementById('quizScore');
  if (quizState.answered.every(Boolean)) {
    score.classList.add('show');
    document.getElementById('scoreNum').textContent = `${quizState.score} / ${quizzes.length}`;
    const pct = quizState.score / quizzes.length;
    document.getElementById('scoreMsg').textContent =
      pct === 1 ? '완벽해! 결과보어 好 마스터!' :
      pct >= 0.7 ? '잘했어! 한 번 더 풀면 완성.' :
      '틀린 문제 해설 다시 읽어봐.';
  } else {
    score.classList.remove('show');
  }
}

function answerQuiz(qi, oi) {
  if (quizState.answered[qi]) return;
  quizState.answered[qi] = true;
  if (oi === quizzes[qi].ans) quizState.score++;
  // Mark buttons
  quizzes[qi].opts.forEach((_, i) => {
    const btn = document.getElementById(`opt-${qi}-${i}`);
    btn.disabled = true;
    if (i === quizzes[qi].ans) btn.classList.add('correct');
    else if (i === oi) btn.classList.add('wrong');
  });
  document.getElementById(`exp-${qi}`).classList.add('show');
  const done = quizState.answered.filter(Boolean).length;
  document.getElementById('quizProgress').textContent = `${done} / ${quizzes.length} 완료`;
  if (quizState.answered.every(Boolean)) {
    setTimeout(() => {
      const score = document.getElementById('quizScore');
      score.classList.add('show');
      document.getElementById('scoreNum').textContent = `${quizState.score} / ${quizzes.length}`;
      const pct = quizState.score / quizzes.length;
      document.getElementById('scoreMsg').textContent =
        pct === 1 ? '완벽해! 결과보어 好 마스터!' :
        pct >= 0.7 ? '잘했어! 한 번 더 풀면 완성.' :
        '틀린 문제 해설 다시 읽어봐.';
    }, 300);
  }
}

function resetQuiz() {
  quizState = { cur: 0, score: 0, answered: new Array(quizzes.length).fill(false) };
  renderQuiz();
}

// ─── INIT ────────────────────────────────────────────────

renderBuilder();
renderComplements();
renderQuiz();
</script>
