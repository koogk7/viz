<html lang="ko">
<head>
<meta charset="utf-8">

<title>📺 시청 캘린더 · watch-scribe</title>
<style>
  :root{ --bg:#0f1012; --panel:#1a1b1f; --line:#2a2b31; --txt:#ececec; --dim:#8b9096; --accent:#ff4d4d; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{ margin:0 auto; max-width:760px; background:var(--bg); color:var(--txt); font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  header{ padding:12px 14px 6px; position:sticky; top:0; background:var(--bg); z-index:10; }
  .hrow{ display:flex; align-items:center; justify-content:space-between; }
  header h1{ font-size:16px; margin:0; }
  .nav{ display:flex; align-items:center; gap:4px; }
  .nav button{ background:transparent; color:var(--dim); border:none; border-radius:50%; width:32px; height:32px; font-size:17px; cursor:pointer; }
  .nav button:hover{ background:#ffffff14; }
  .nav .mlabel{ min-width:104px; text-align:center; font-weight:600; font-size:14px; color:var(--txt); }
  .modes{ display:inline-flex; border:1px solid var(--line); border-radius:7px; overflow:hidden; margin-top:9px; }
  .modes button{ background:transparent; border:none; border-right:1px solid var(--line); color:var(--dim); padding:5px 15px; font-size:13px; font-weight:600; cursor:pointer; }
  .modes button:last-child{ border-right:none; }
  .modes button.on{ background:var(--accent); color:#fff; }

  .grid{ display:grid; grid-template-columns:repeat(7,1fr); border-top:1px solid var(--line); }
  .grid.hide{ display:none; }
  .dow{ padding:7px 2px; font-size:11px; font-weight:500; color:var(--dim); text-align:center; letter-spacing:.5px; }
  .cell{ border-bottom:1px solid var(--line); border-right:1px solid var(--line); min-height:82px; padding:3px; position:relative; overflow:hidden; }
  .cell:nth-child(7n){ border-right:none; }
  .cell.empty{ background:#ffffff05; }
  .cell.has{ cursor:pointer; }
  .cell.has:hover{ background:#ffffff0a; }
  .dnum{ font-size:11.5px; color:var(--dim); width:22px; height:22px; display:flex; align-items:center; justify-content:center; border-radius:50%; margin-bottom:1px; }
  .cell.today .dnum{ background:var(--accent); color:#fff; font-weight:600; }
  .chip{ display:block; font-size:10.5px; line-height:17px; padding:0 5px; margin:1px 0; border-radius:4px; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:500; }
  .more{ font-size:10px; color:var(--dim); padding:1px 5px; }
  .c0{background:#039be5}.c1{background:#7986cb}.c2{background:#33b679}.c3{background:#8e24aa}.c4{background:#e67c73}
  .c5{background:#f6bf26;color:#333}.c6{background:#f4511e}.c7{background:#616161}.c8{background:#3f51b5}.c9{background:#0b8043}

  .tl{ padding:10px 14px 48px; }
  .sec{ margin-bottom:16px; scroll-margin-top:96px; }
  .sec h2{ font-size:13px; color:var(--dim); font-weight:600; margin:0 2px 9px; }
  .sec h2 b{ color:var(--txt); }
  .card{ position:relative; display:flex; gap:11px; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:9px; margin-bottom:10px; }
  .card .thumb{ position:relative; flex:0 0 auto; width:148px; aspect-ratio:16/9; border-radius:8px; overflow:hidden; background:#000; }
  .card .thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
  .card .thumb .play{ position:absolute; right:6px; bottom:6px; background:rgba(0,0,0,.72); color:#fff; font-size:11px; padding:1px 7px; border-radius:11px; }
  .card .thumb .pbar{ position:absolute; left:0; right:0; bottom:0; height:3px; background:rgba(255,255,255,.25); }
  .card .thumb .pbar span{ display:block; height:100%; background:var(--accent); }
  .card .thumb .pbadge{ position:absolute; left:6px; top:6px; background:rgba(0,0,0,.72); color:#fff; font-size:10.5px; font-weight:600; padding:1px 6px; border-radius:9px; }
  .card .thumb .pbadge.full{ color:#7ce38b; }
  .filters{ display:flex; gap:6px; margin-top:8px; overflow-x:auto; padding-bottom:2px; }
  .filters button{ background:transparent; border:1px solid var(--line); border-radius:14px; color:var(--dim); padding:3px 11px; font-size:12px; font-weight:600; cursor:pointer; white-space:nowrap; }
  .filters button.on{ background:#ffffff14; color:var(--txt); border-color:var(--dim); }
  .card .meta{ min-width:0; display:flex; flex-direction:column; }
  .card .t{ font-weight:600; font-size:14px; margin:1px 0 5px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .card .o{ color:var(--dim); font-size:12.5px; margin:0 0 auto; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  .card .ch{ color:var(--dim); font-size:11.5px; margin-top:7px; }
  .card a.full{ position:absolute; inset:0; }
  .reqbtn{ position:relative; z-index:2; margin-top:8px; align-self:flex-start; background:#ffffff10; color:var(--accent); border:1px solid var(--accent); border-radius:7px; padding:4px 11px; font-size:11.5px; font-weight:600; cursor:pointer; }
  .reqbtn:disabled{ color:var(--dim); border-color:var(--line); cursor:default; }
  .noteln{ position:relative; z-index:2; margin-top:8px; align-self:flex-start; color:var(--dim); font-size:11.5px; font-weight:600; text-decoration:none; border:1px solid var(--line); border-radius:7px; padding:4px 11px; }
  .noteln:hover{ color:var(--txt); border-color:var(--dim); }
  .empty-msg{ color:var(--dim); text-align:center; padding:44px 0; }
  /* 통계 막대 */
  .stat-sec{ padding:2px 14px 10px; }
  .stat-sec h3{ font-size:13px; color:var(--txt); font-weight:700; margin:18px 0 9px; }
  .stat-sum{ font-size:13px; color:var(--dim); padding:12px 14px 4px; }
  .bar{ display:flex; align-items:center; gap:8px; margin:4px 0; font-size:12px; }
  .bar .bl{ width:96px; flex:0 0 auto; color:var(--txt); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .bar .btrack{ flex:1; height:15px; background:#ffffff0a; border-radius:4px; overflow:hidden; display:block; }
  .bar .bf{ display:block; height:100%; background:var(--accent); border-radius:4px; }
  .bar .bn{ width:58px; flex:0 0 auto; color:var(--dim); font-size:11px; text-align:right; }
  footer{ color:var(--dim); font-size:11px; text-align:center; padding:18px; border-top:1px solid var(--line); }
</style>
</head>

let cur = allDates.length ? allDates[allDates.length-1] : new Date().toISOString().slice(0,10);
let mode = "month";
const today = new Date().toISOString().slice(0,10);
const thumb = v => v ? `https://img.youtube.com/vi/${v}/mqdefault.jpg` : "";
const esc = s => (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function chColor(ch){ let h=0; for(const c of (ch||"")) h=(h*31+c.charCodeAt(0))>>>0; return "c"+(h%10); }
const iso = d => d.toISOString().slice(0,10);
const addDays = (ds,n)=>{ const d=new Date(ds); d.setDate(d.getDate()+n); return iso(d); };
function weekRange(ds){ const d=new Date(ds); const s=new Date(d); s.setDate(d.getDate()-d.getDay()); const e=new Date(s); e.setDate(s.getDate()+6); return [iso(s),iso(e)]; }

function cardHtml(v){
  const pb = v.progress!=null ? `<span class="pbar"><span style="width:${Math.min(v.progress,100)}%"></span></span><span class="pbadge ${v.progress>=90?'full':''}">${v.progress}%</span>` : '';
  return `
  <div class="card">
    <a class="full" href="${v.url}" target="_blank" aria-label="${esc(v.title)}"></a>
    <div class="thumb"><img loading="lazy" src="${thumb(v.video_id)}" onerror="this.parentNode.style.background='#222'"><span class="play">▶</span>${pb}</div>
    <div class="meta"><div class="t">${esc(v.title)}</div>${v.one_liner?`<div class="o">${esc(v.one_liner)}</div>`:`<div class="o" style="opacity:.45">요약 대기 중</div>`}${v.author?`<div class="ch">${esc(v.author)}</div>`:''}${v.note_rel?`<a class="noteln" href="obsidian://open?vault=sec-brain&file=${encodeURIComponent(v.note_rel)}" onclick="event.stopPropagation()">📄 노트 열기</a>${WEBHOOK?` <button class="reqbtn" onclick="reqSummary(event,'${v.video_id}')">🔍 딥 요약</button>`:''}`:(WEBHOOK?`<button class="reqbtn" onclick="reqSummary(event,'${v.video_id}')">📝 요약요청</button>`:'')}</div>
  </div>`; }

// 진행률 필터
const FILTERS = [
  ["all",  "전체",      v=>true],
  ["done", "✅ 90%+",   v=>v.progress!=null && v.progress>=90],
  ["part", "🌓 <90%",   v=>v.progress!=null && v.progress<90],
  ["none", "❔ 미측정",  v=>v.progress==null],
];
let filt = "all";
const filtFn = () => FILTERS.find(f=>f[0]===filt)[2];
const fvids = ds => (DATA[ds]||[]).filter(filtFn());
function renderFilters(){
  const all = Object.values(DATA).flat();
  document.getElementById("filters").innerHTML = FILTERS.map(([k,label,fn])=>
    `<button data-f="${k}" class="${k===filt?'on':''}">${label} ${all.filter(fn).length}</button>`).join("");
  document.querySelectorAll("#filters button").forEach(b=>b.onclick=()=>{ filt=b.dataset.f; render(); });
}

function timeline(dates){
  const tl = document.getElementById("tl");
  const secs = dates.map(ds=>[ds, fvids(ds)]).filter(([,v])=>v.length);
  if(!secs.length){ tl.innerHTML = `<div class="empty-msg">이 기간엔 받아적은 영상이 없어요.</div>`; return; }
  tl.innerHTML = secs.map(([ds,vids])=>{
    const dow = DOW[new Date(ds).getDay()];
    return `<div class="sec" id="sec-${ds}"><h2><b>${ds.slice(5)}</b> ${dow} · ${vids.length}편</h2>${vids.map(cardHtml).join("")}</div>`;
  }).join("");
}

function bars(entries, max){
  return entries.map(([label,n])=>`<div class="bar"><span class="bl">${esc(label)}</span><span class="btrack"><span class="bf" style="width:${Math.max(n/max*100,2)}%"></span></span><span class="bn">${n}</span></div>`).join("");
}
function statsView(){
  document.getElementById("mlabel").textContent = "전체 통계" + (filt!=="all" ? " (필터 적용)" : "");
  const all = Object.values(DATA).flat().filter(filtFn());
  const ch={}, dow=[0,0,0,0,0,0,0], mon={}, monSec={};
  let totalSec=0;
  all.forEach(v=>{ const s=v.duration_sec||0;
    if(v.author){ (ch[v.author]=ch[v.author]||{c:0,s:0}); ch[v.author].c++; ch[v.author].s+=s; }
    dow[new Date(v.date).getDay()]++;
    const k=v.date.slice(0,7); mon[k]=(mon[k]||0)+1; monSec[k]=(monSec[k]||0)+s; totalSec+=s; });
  const topCh = Object.entries(ch).sort((a,b)=>b[1].s-a[1].s).slice(0,12);
  const maxChS = topCh.length?topCh[0][1].s:1;
  const fmtCh = sec => sec>=3600 ? `${(sec/3600).toFixed(1)}h` : `${Math.round(sec/60)}m`;
  const chBars = topCh.map(([c,o])=>`<div class="bar"><span class="bl">${esc(c)}</span><span class="btrack"><span class="bf" style="width:${Math.max(o.s/maxChS*100,2)}%"></span></span><span class="bn">${fmtCh(o.s)}·${o.c}</span></div>`).join("");
  const dowE = DOW.map((d,i)=>[d, dow[i]]);
  const maxDow = Math.max(...dow,1);
  const monE = Object.entries(mon).sort();
  const maxMon = Math.max(...monE.map(m=>m[1]),1);
  // 시청 시간 (시간 단위 막대)
  const monH = Object.entries(monSec).sort().map(([k,s])=>[k, +(s/3600).toFixed(1)]);
  const maxMonH = Math.max(...monH.map(m=>m[1]),1);
  const fmtDur = sec => sec>=3600 ? `${Math.floor(sec/3600)}h ${Math.round(sec%3600/60)}m` : `${Math.round(sec/60)}m`;
  document.getElementById("tl").innerHTML =
    `<div class="stat-sum">총 <b style="color:var(--txt)">${all.length}편</b> · 시청 <b style="color:var(--accent)">${fmtDur(totalSec)}</b> · 채널 ${Object.keys(ch).length}개</div>`
    + `<div class="stat-sec"><h3>채널 TOP (시청시간·편수)</h3>${chBars}</div>`
    + `<div class="stat-sec"><h3>월별 시청 시간 (h)</h3>${bars(monH, maxMonH)}</div>`
    + `<div class="stat-sec"><h3>요일 패턴 (편수)</h3>${bars(dowE, maxDow)}</div>`
    + `<div class="stat-sec"><h3>월별 편수</h3>${bars(monE, maxMon)}</div>`;
}
function render(){
  const grid = document.getElementById("grid");
  if(mode==="stats"){ grid.classList.add("hide"); statsView(); renderFilters(); return; }
  const [y,m,d] = cur.split("-").map(Number);
  if(mode==="month"){
    grid.classList.remove("hide");
    document.getElementById("mlabel").textContent = `${y}.${String(m).padStart(2,"0")}`;
    const first = new Date(y, m-1, 1).getDay();
    const days = new Date(y, m, 0).getDate();
    grid.innerHTML = DOW.map(x=>`<div class="dow">${x}</div>`).join("");
    for(let i=0;i<first;i++) grid.insertAdjacentHTML("beforeend", `<div class="cell empty"></div>`);
    for(let dd=1; dd<=days; dd++){
      const ds = `${y}-${String(m).padStart(2,"0")}-${String(dd).padStart(2,"0")}`;
      const vids = fvids(ds);
      let chips = vids.slice(0,MAX_CHIP).map(v=>`<span class="chip ${chColor(v.author||v.video_id)}">${esc(v.title)}</span>`).join("");
      if(vids.length>MAX_CHIP) chips += `<div class="more">+${vids.length-MAX_CHIP}개 더</div>`;
      grid.insertAdjacentHTML("beforeend", `<div class="cell ${vids.length?"has":""} ${ds===today?"today":""}" data-d="${ds}"><div class="dnum">${dd}</div>${chips}</div>`);
    }
    grid.querySelectorAll(".cell.has").forEach(c=>c.onclick=()=>{ const el=document.getElementById("sec-"+c.dataset.d); if(el) el.scrollIntoView({behavior:"smooth",block:"start"}); });
    timeline(Object.keys(DATA).filter(k=>k.startsWith(`${y}-${String(m).padStart(2,"0")}`)).sort().reverse());
  } else if(mode==="week"){
    grid.classList.add("hide");
    const [s,e] = weekRange(cur);
    document.getElementById("mlabel").textContent = `${s.slice(5)}~${e.slice(5)}`;
    timeline(Object.keys(DATA).filter(k=>k>=s && k<=e).sort().reverse());
  } else {
    grid.classList.add("hide");
    document.getElementById("mlabel").textContent = `${cur.slice(5)} ${DOW[new Date(cur).getDay()]}`;
    timeline([cur]);
  }
  renderFilters();
}
function step(dir){
  if(mode==="stats") return;
  if(mode==="month"){ const d=new Date(cur); d.setMonth(d.getMonth()+dir); d.setDate(1); cur=iso(d); }
  else if(mode==="week"){ cur=addDays(cur, dir*7); }
  else { cur=addDays(cur, dir); }
  render(); window.scrollTo({top:0});
}
document.getElementById("prev").onclick=()=>step(-1);
document.getElementById("next").onclick=()=>step(1);
document.querySelectorAll(".modes button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".modes button").forEach(x=>x.classList.remove("on"));
  b.classList.add("on"); mode=b.dataset.m; render(); window.scrollTo({top:0});
});
// 🔒 비밀번호 게이트 (PW_HASH 비어있으면 통과)
const PW_HASH = "c6c66851388ff60faa87f46483ab89803f1bcb359487bcf7c7ce4dcba5b1011c";
async function sha256(s){ const b=await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join(""); }
async function gate(){
  if(!PW_HASH) return true;
  if(localStorage.getItem("ws_cal_auth")===PW_HASH) return true;
  for(let i=0;i<3;i++){
    const pw = prompt("🔒 시청 캘린더 — 비밀번호");
    if(pw===null) break;
    if(await sha256(pw)===PW_HASH){ localStorage.setItem("ws_cal_auth",PW_HASH); return true; }
  }
  document.body.innerHTML='<p style="color:#888;text-align:center;padding:80px 20px;font:15px sans-serif">🔒 접근 권한이 없습니다.</p>';
  return false;
}
(async()=>{ if(await gate()) render(); })();
</script>
</body>
