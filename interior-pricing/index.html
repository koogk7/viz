<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>인테리어 가격 감각 딥다이브</title>
<link rel="icon" href="data:,">
<meta name="description" content="59㎡ 30년차 아파트 올수리 공정별·자재 등급별 가격 감각을 기르는 도구 (2026 서울·수도권 추정)">
<style>
:root{
  --bg:#f3f1ec; --surface:#fbfaf7; --surface2:#ebe8e0; --ink:#1e1c19; --ink2:#57524a; --ink3:#7a746a;
  --line:#dbd6ca; --accent:#0d6e78; --accent-ink:#ffffff; --accent-soft:#d8eaeb;
  --g-budget:#5a8228; --g-budget-soft:#e4ecd5; --g-mid:#a96b0f; --g-mid-soft:#f2e4c8; --g-prem:#a23d66; --g-prem-soft:#f1dbe4;
  --ok:#2a7a4b; --ok-soft:#d9eddf; --bad:#b0352d; --bad-soft:#f3dad7;
  --c-struct:#0d6e78; --c-finish:#8c7f68; --c-furn:#4f6a85; --c-opt:#a23d66; --c-mgmt:#9a958b;
  --shadow:0 1px 0 rgba(30,28,25,.04),0 6px 18px -10px rgba(30,28,25,.25);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141311; --surface:#1d1b19; --surface2:#292623; --ink:#ece8e1; --ink2:#b7b0a5; --ink3:#8f897e;
    --line:#37332e; --accent:#58bbc5; --accent-ink:#062a2e; --accent-soft:#163538;
    --g-budget:#9cc566; --g-budget-soft:#2a331d; --g-mid:#e2a645; --g-mid-soft:#3a2d14; --g-prem:#e283a8; --g-prem-soft:#3d2230;
    --ok:#74c796; --ok-soft:#1c3226; --bad:#f09088; --bad-soft:#3d1f1c;
    --c-struct:#58bbc5; --c-finish:#b0a187; --c-furn:#7f9cba; --c-opt:#e283a8; --c-mgmt:#6e6a62;
    --shadow:0 1px 0 rgba(0,0,0,.3),0 6px 18px -10px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141311; --surface:#1d1b19; --surface2:#292623; --ink:#ece8e1; --ink2:#b7b0a5; --ink3:#8f897e;
  --line:#37332e; --accent:#58bbc5; --accent-ink:#062a2e; --accent-soft:#163538;
  --g-budget:#9cc566; --g-budget-soft:#2a331d; --g-mid:#e2a645; --g-mid-soft:#3a2d14; --g-prem:#e283a8; --g-prem-soft:#3d2230;
  --ok:#74c796; --ok-soft:#1c3226; --bad:#f09088; --bad-soft:#3d1f1c;
  --c-struct:#58bbc5; --c-finish:#b0a187; --c-furn:#7f9cba; --c-opt:#e283a8; --c-mgmt:#6e6a62;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 6px 18px -10px rgba(0,0,0,.7);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Segoe UI",sans-serif;
  font-variant-numeric:tabular-nums;overflow-x:hidden;word-break:keep-all;overflow-wrap:break-word}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px 64px}
h1{font-size:26px;line-height:1.2;margin:0;letter-spacing:-.02em;font-weight:800}
h2{font-size:20px;line-height:1.3;margin:0 0 4px;letter-spacing:-.01em;font-weight:750}
h3{font-size:15px;margin:0 0 6px;font-weight:700}
p{margin:0}
.small,.muted{font-size:13px;color:var(--ink2)}
a{color:var(--accent)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}

header.top{padding:20px 0 12px;display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
header.top .sub{margin-top:6px;max-width:60ch}
.theme-btn{flex:none;min-width:44px;min-height:44px;border:1px solid var(--line);background:var(--surface);border-radius:12px;font-size:13px;padding:0 12px}

.tabs{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);padding:8px 0;margin:0 -16px 16px;padding-left:16px;padding-right:16px;border-bottom:1px solid var(--line)}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--surface2);padding:4px;border-radius:14px;max-width:760px}
.seg button{border:0;background:transparent;min-height:44px;border-radius:10px;font-size:13px;font-weight:650;color:var(--ink2);padding:0 4px;line-height:1.2}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
@media(min-width:520px){.seg button{font-size:15px}h1{font-size:28px}}

.tabpanel[hidden]{display:none}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border:1px solid var(--line);background:var(--surface);border-radius:999px;font-size:13px;color:var(--ink2)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:650}
.tag{display:inline-flex;align-items:center;padding:2px 9px;border-radius:999px;font-size:12px;line-height:1.5;background:var(--surface2);color:var(--ink2);white-space:nowrap}
.tag.budget{background:var(--g-budget-soft);color:var(--g-budget)}
.tag.mid{background:var(--g-mid-soft);color:var(--g-mid)}
.tag.premium{background:var(--g-prem-soft);color:var(--g-prem)}
.tag.est{background:var(--g-mid-soft);color:var(--g-mid)}
input[type=search],select{min-height:44px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:0 12px;font:inherit;min-width:0}
input[type=search]{flex:1 1 200px}

/* process cards */
.proc-list{list-style:none;margin:0;padding:0;position:relative}
.proc{position:relative;padding-left:44px;padding-bottom:14px}
.proc::before{content:"";position:absolute;left:15px;top:30px;bottom:-4px;width:2px;background:var(--line)}
.proc:last-child::before{display:none}
.proc .rail{position:absolute;left:0;top:10px;width:32px;height:32px;border-radius:50%;background:var(--surface);border:2px solid var(--accent);color:var(--accent);font-weight:800;font-size:13px;display:grid;place-items:center}
.proc.last .rail{border-style:dashed}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.card-head{width:100%;text-align:left;background:transparent;border:0;padding:14px 14px 10px;display:block;border-radius:16px}
.card-title{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.card-title b{font-size:17px;font-weight:750;letter-spacing:-.01em}
.one{margin:4px 0 10px;color:var(--ink2);font-size:13px}
.bars{display:grid;gap:5px}
.brow{display:grid;grid-template-columns:44px 1fr auto;gap:8px;align-items:center;font-size:13px}
.brow .lab{font-size:12px;font-weight:650}
.brow .lab.budget{color:var(--g-budget)}.brow .lab.mid{color:var(--g-mid)}.brow .lab.premium{color:var(--g-prem)}
.track{position:relative;height:14px;background:var(--surface2);border-radius:6px;overflow:hidden}
.band{position:absolute;top:0;bottom:0;border-radius:6px;min-width:6px}
.band.budget{background:var(--g-budget)}.band.mid{background:var(--g-mid)}.band.premium{background:var(--g-prem)}
.brow .val{min-width:78px;text-align:right;font-size:13px;color:var(--ink)}
.axis{display:grid;grid-template-columns:44px 1fr auto;gap:8px;font-size:11px;color:var(--ink3);margin-top:2px}
.axis .ax{display:flex;justify-content:space-between}
.axis>span:last-child{min-width:78px;text-align:right}
.meta{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.meter{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2)}
.meter i{display:block;width:64px;height:6px;border-radius:3px;background:var(--surface2);overflow:hidden}
.meter i b{display:block;height:100%;background:var(--accent)}
.expand{display:flex;justify-content:space-between;align-items:center;min-height:44px;padding:0 14px;font-size:13px;color:var(--accent);font-weight:650;width:100%;background:transparent;border:0;border-top:1px solid var(--line);border-radius:0 0 16px 16px}
.detail{padding:4px 14px 14px;display:grid;gap:14px;border-top:1px solid var(--line)}
.detail[hidden]{display:none}
.detail ul{margin:0;padding-left:18px}
.detail li{margin:3px 0}
.dgrid{display:grid;gap:12px}
@media(min-width:760px){.dgrid{grid-template-columns:1fr 1fr}}
.gcard{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg)}
.gcard .small{margin-top:2px}
.warn{background:var(--bad-soft);border-radius:10px;padding:10px 12px}
.save{background:var(--ok-soft);border-radius:10px;padding:10px 12px}
.srcs{display:grid;gap:4px;font-size:13px}
.srcs a{word-break:break-all}
.note-est{font-size:12px;color:var(--g-mid)}

/* quiz */
.qwrap{max-width:720px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.prog{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden;margin:8px 0 16px}
.prog b{display:block;height:100%;width:100%;background:var(--accent);transform-origin:left;transition:transform .25s}
.prompt{font-size:17px;font-weight:700;line-height:1.5;margin:10px 0 14px}
.choices{display:grid;gap:8px}
.choice{display:flex;gap:10px;align-items:flex-start;text-align:left;min-height:52px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);font-size:15px;width:100%}
.choice .k{flex:none;width:24px;height:24px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-size:12px;font-weight:750}
.choice:hover:not(:disabled){border-color:var(--accent)}
.choice.correct{border-color:var(--ok);background:var(--ok-soft)}
.choice.wrong{border-color:var(--bad);background:var(--bad-soft)}
.choice:disabled{cursor:default;color:var(--ink)}
.choice .res{margin-left:auto;font-size:12px;font-weight:750;white-space:nowrap}
.choice.correct .res{color:var(--ok)}.choice.wrong .res{color:var(--bad)}
.expl{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--accent-soft);font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 20px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.big{font-size:44px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.acc{display:grid;gap:8px;margin-top:12px}
.accrow{display:grid;grid-template-columns:minmax(90px,150px) 1fr 48px;gap:8px;align-items:center;font-size:13px}
.accrow .track{height:10px}
.accrow .track b{position:absolute;left:0;top:0;bottom:0;border-radius:5px}

/* estimator */
.est-grid{display:grid;gap:16px}
@media(min-width:860px){.est-grid{grid-template-columns:340px 1fr;align-items:start}.ctrls{position:sticky;top:76px}}
.field{margin-bottom:14px}
.field label,.field .lbl{display:flex;justify-content:space-between;gap:12px;align-items:baseline;font-weight:650;font-size:14px;margin-bottom:6px}
input[type=range]{width:100%;height:44px;accent-color:var(--accent);background:transparent}
.sw{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:48px;padding:6px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:8px;width:100%;text-align:left}
.sw .t{display:grid}
.sw .t span:last-child{font-size:12px;color:var(--ink2)}
.sw .knob{flex:none;width:44px;height:26px;border-radius:13px;background:var(--surface2);border:1px solid var(--line);position:relative;transition:background .15s}
.sw .knob::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--ink3);transition:transform .15s,background .15s}
.sw[aria-checked="true"] .knob{background:var(--accent);border-color:var(--accent)}
.sw[aria-checked="true"] .knob::after{transform:translateX(18px);background:var(--accent-ink)}
.seg3{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--surface2);padding:4px;border-radius:12px}
.seg3 button{border:0;background:transparent;min-height:44px;border-radius:9px;font-weight:650;color:var(--ink2)}
.seg3 button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.total{display:flex;flex-wrap:wrap;gap:4px 16px;align-items:baseline}
.total .big{color:var(--ink)}
.stack{display:flex;height:40px;border-radius:10px;overflow:hidden;gap:2px;background:var(--bg);margin:12px 0 8px}
.stack>div{min-width:2px;position:relative;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--accent-ink);overflow:hidden;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.callout{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--accent-soft);margin-top:14px}
.callout ol{margin:6px 0 0;padding-left:20px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{padding:9px 6px;text-align:right;border-bottom:1px solid var(--line)}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl th button{white-space:nowrap;background:transparent;border:0;font-weight:700;font-size:13px;min-height:44px;padding:0 4px;color:var(--ink2)}
.tbl th[aria-sort] button{color:var(--ink)}
.tbl tfoot td{font-weight:750;border-bottom:0}
.toolbar#mcats{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;margin-right:-16px;padding-right:16px}
#mcats .chip{flex:none}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}
.nl{position:relative;height:116px;margin:40px 8px 0}
.nl .line{position:absolute;left:0;right:0;top:76px;height:4px;background:var(--surface2);border-radius:2px}
.nl .tick{position:absolute;top:84px;font-size:11px;color:var(--ink3);transform:translateX(-50%)}
.nl .tick::before{content:"";position:absolute;left:50%;top:-10px;width:1px;height:6px;background:var(--line)}
.nl .stem{position:absolute;width:1px;background:var(--ink3);opacity:.6}
.nl .dot{position:absolute;width:20px;height:20px;margin-left:-10px;border-radius:50%;background:var(--c-furn);color:#fff;font-size:11px;font-weight:750;display:grid;place-items:center;border:2px solid var(--surface)}
.nl .dot.k2026{background:var(--g-mid)}.nl .dot.k2025{background:var(--ink3)}.nl .dot.kb{background:var(--g-budget)}
.nl .rng{position:absolute;top:74px;height:8px;border-radius:4px;background:var(--g-mid);opacity:.35}
.nl .me{position:absolute;top:0;width:2px;margin-left:-1px;background:var(--accent);height:84px}
.nl .me span{position:absolute;top:-22px;left:0;transform:translateX(-50%);background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:750;padding:1px 8px;border-radius:999px;white-space:nowrap}
.cases{margin:6px 0 0;padding:0;list-style:none;display:grid;gap:4px;font-size:13px}
.cases li{display:flex;gap:8px;align-items:center}
.cases .n{flex:none;width:20px;height:20px;border-radius:50%;color:#fff;font-size:11px;font-weight:750;display:grid;place-items:center}

/* materials */
.mtbl{width:100%;border-collapse:collapse;font-size:14px}
.mtbl th{font-size:12px;text-align:left;color:var(--ink2);padding:8px 8px;border-bottom:1px solid var(--line);font-weight:650}
.mtbl td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.mtbl tr.hit td{background:var(--ok-soft)}
.mtbl tr.miss td{opacity:.85}
.dots{display:inline-flex;gap:3px;vertical-align:middle}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--surface2);border:1px solid var(--line)}
.dots i.on{background:var(--accent);border-color:var(--accent)}
@media(max-width:640px){
  .mtbl thead{display:none}
  .mtbl,.mtbl tbody,.mtbl tr,.mtbl td{display:block;width:100%}
  .mtbl tr{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px;background:var(--surface)}
  .mtbl td{border:0;padding:3px 0;display:flex;justify-content:space-between;gap:12px;text-align:right}
  .mtbl td::before{content:attr(data-label);color:var(--ink2);font-size:12px;text-align:left;flex:none}
  .mtbl td.nm{font-weight:750;font-size:15px;text-align:left;display:block}
  .mtbl td.nm::before{display:none}
  .mtbl td.need{display:block;text-align:left;margin-top:6px;padding-top:6px;border-top:1px dashed var(--line)}
  .mtbl td.need::before{display:block;margin-bottom:2px}
  .mtbl tr.hit{border-color:var(--ok)}
  .mtbl tr.hit td{background:transparent}
}
.cover{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden;margin-top:4px;min-width:90px}
.cover b{display:block;height:100%;background:var(--ok)}
.cover b.part{background:var(--g-mid)}

.mini{position:sticky;bottom:10px;z-index:5;margin-top:14px;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 16px;border-radius:14px;background:var(--accent);color:var(--accent-ink);box-shadow:0 8px 24px -8px rgba(0,0,0,.45);font-weight:700}
.mini span:last-child{font-size:12px;font-weight:600}
@media(min-width:860px){.mini{display:none}}
footer{margin-top:32px;padding-top:16px;border-top:1px solid var(--line);display:grid;gap:12px}
details summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:650}
.srclist{columns:1;font-size:13px}
@media(min-width:760px){.srclist{columns:2;column-gap:24px}}
.srclist li{break-inside:avoid;margin:0 0 6px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="wrap">
<header class="top">
  <div>
    <h1>인테리어 가격 감각 딥다이브</h1>
    <p class="muted sub">전용 59㎡(25평) 30년차 아파트 올수리를 기준으로 공정별 단가, 자재 등급, 견적 구조를 몸으로 익히는 도구입니다. 2026년 서울·수도권 추정 범위.</p>
  </div>
  <button class="theme-btn" id="themeBtn" aria-pressed="false" aria-label="다크 모드 전환">테마</button>
</header>

<nav class="tabs" aria-label="섹션">
  <div class="seg" role="tablist" id="tablist">
    <button role="tab" id="tab-proc" aria-controls="p-proc" aria-selected="true" data-tab="proc">공정 카드</button>
    <button role="tab" id="tab-quiz" aria-controls="p-quiz" aria-selected="false" tabindex="-1" data-tab="quiz">가격 퀴즈</button>
    <button role="tab" id="tab-est" aria-controls="p-est" aria-selected="false" tabindex="-1" data-tab="est">견적서 해부</button>
    <button role="tab" id="tab-mat" aria-controls="p-mat" aria-selected="false" tabindex="-1" data-tab="mat">자재 등급표</button>
  </div>
</nav>

<main>
<section class="tabpanel" id="p-proc" role="tabpanel" aria-labelledby="tab-proc"></section>
<section class="tabpanel" id="p-quiz" role="tabpanel" aria-labelledby="tab-quiz" hidden></section>
<section class="tabpanel" id="p-est" role="tabpanel" aria-labelledby="tab-est" hidden></section>
<section class="tabpanel" id="p-mat" role="tabpanel" aria-labelledby="tab-mat" hidden></section>
</main>

<footer>
  <details><summary>출처 목록 (<span id="srcCount"></span>건)</summary><ul class="srclist" id="srclist"></ul></details>
  <p class="small" id="disc"></p>
  <p class="small">생성일 2026-10-05 · 형제 페이지: <a href="https://koogk7.github.io/viz/interior-basics/">interior-basics (공정 순서·용어·예산 시뮬레이터)</a></p>
</footer>

    el("div",{class:"prog",role:"progressbar","aria-valuemin":0,"aria-valuemax":n,"aria-valuenow":QZ.i+(ans?1:0)},el("b",{style:`transform:scaleX(${((QZ.i+(ans?1:0))/n).toFixed(3)})`})),
    el("span",{class:"tag",text:PM[q.processId].name}),
    el("p",{class:"prompt",text:q.prompt}),
    el("div",{class:"choices",role:"group","aria-label":"보기"},q.choices.map((c,k)=>{

    })),

function pick(k){

  const q=QZ.order[QZ.i];QZ.picked=k;
  QZ.res.push({idx:q.idx,processId:q.processId,ok:q.choices[k].ok});

function next(){QZ.i++;QZ.picked=null;if(QZ.i>=QZ.order.length){QZ.mode="end";finish();}renderQuiz();window.scrollTo({top:0});}
function finish(){

    const ok=QZ.res.filter(x=>x.ok).length,pct=Math.round(ok/QZ.res.length*100);

function renderResult(w){

function qtyAt(item,py){

}
function calc(st){

  E.items.forEach(it=>{
    const amt=adj(it.base[g],it.k,it.laborShare);
    const q=qtyAt(it,st.py);
    lines.push({id:it.processId,name:it.name,amount:amt,cat:PM[it.processId].category,unit:it.unit,qty:q,unitPrice:amt/q});
  });
  E.options.forEach(o=>{
    if(!st.opts[o.id])return;
    const amt=adj(o.base[g],o.k,o.laborShare);
    const p=PM[o.processId];
    lines.push({id:o.id,name:o.label+" (옵션)",amount:amt,cat:"옵션",unit:p.unit,qty:p.qty25,unitPrice:amt/p.qty25});
  });

  let ov=0;
  if(!(st.semi&&E.semiSelf.removeOverhead)){ov=sub*E.overheadRate[g];lines.push({id:"mgmt",name:"현장관리·경비·이윤",amount:ov,cat:"현장이윤",unit:"%",qty:E.overheadRate[g]*100,unitPrice:E.overheadRate[g]*100});}

    el("div",{class:"total"},el("div",{class:"big num",text:f(Math.round(R.total))+"만원"}),el("span",{class:"muted",text:"VAT 별도"})),
    el("p",{class:"small num",text:`VAT 10% 포함 약 ${f(Math.round(R.total*1.1))}만원 · 평당 ${f(Math.round(R.perPy))}만원 (VAT 별도)`}),
    el("div",{class:"stack",role:"img","aria-label":"공정별 비중 누적 막대"},R.lines.map(l=>el("div",{style:`width:${l.pct}%;background:${CATCOL[l.cat]}`,title:`${l.name} ${f(Math.round(l.amount))}만원 (${l.pct.toFixed(1)}%)`},l.pct>=9.5?el("span",{text:l.name.replace(/\(.*\)/,"").replace(/현장관리·경비·이윤/,"이윤").trim().slice(0,5)}):null))),
    el("div",{class:"legend"},Object.entries(CATCOL).filter(([k])=>R.lines.some(l=>l.cat===k)).map(([k,v])=>el("span",null,el("i",{style:`background:${v}`}),k))),
    el("div",{class:"callout"},el("b",{text:"이 견적에서 가장 큰 3개"}),el("ol",null,top3.map(l=>el("li",null,l.name+" — ",el("b",{class:"num",text:f(Math.round(l.amount))+"만원"})," ("+l.pct.toFixed(1)+"%)")))))
  );
  // table
  const key=ES.sort.key,dir=ES.sort.dir;

      el("thead",null,el("tr",null,th("name","공정"),th("amount","금액"),th("pct","비중"),th("unitPrice","단위 단가"))),

        el("td",{text:l.name}),el("td",{class:"num",text:f(Math.round(l.amount))}),el("td",{class:"num",text:l.pct.toFixed(1)+"%"}),

buildEst();

/* ---------- 4. materials ---------- */
const MS={cat:DATA.materials[0].id,same:false,budget:{}};
DATA.materials.forEach(m=>MS.budget[m.id]=m.defaultBudget);
function buildMat(){
  const r=$("#p-mat");
  r.append(el("h2",{text:"자재 등급표"}),
    el("p",{class:"muted",text:"자재별로 단가, 내구성, 관리 부담, 어울리는 예산대를 비교합니다. 단가는 자재+시공 또는 해당 단위 기준입니다."}),
    el("div",{class:"toolbar",style:"margin-top:12px",id:"mcats"}),
    el("div",{id:"mout"}));
  const mc=$("#mcats");
  DATA.materials.forEach(m=>mc.append(el("button",{class:"chip","aria-pressed":m.id===MS.cat,"data-m":m.id,text:m.title,onclick:()=>{MS.cat=m.id;mc.querySelectorAll(".chip").forEach(b=>b.setAttribute("aria-pressed",b.dataset.m===m.id));renderMat();}})));
  renderMat();
}
function renderMat(){
  const m=DATA.materials.find(x=>x.id===MS.cat),out=$("#mout");out.textContent="";
  const hasNeed=m.rows.some(r=>r.need);
  const bud=MS.budget[m.id];
  const ctr=el("div",{class:"panel",style:"margin-bottom:12px"},
    el("div",{style:"display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:center"},
      el("div",null,el("h3",{text:m.title,style:"margin:0"}),el("p",{class:"small",text:m.unit+(m.note?" · "+m.note:"")})),
      hasNeed?el("button",{class:"chip","aria-pressed":MS.same,onclick:()=>{MS.same=!MS.same;renderMat();}},"같은 돈이면?"):null));
  if(hasNeed&&MS.same){
    const sl=el("input",{type:"range",min:Math.max(10,Math.round(m.defaultBudget*0.2/10)*10),max:m.defaultBudget*3,step:m.defaultBudget>=200?10:5,value:bud,"aria-label":"예산"});
    const sv=el("b",{class:"num",style:"white-space:nowrap",text:f(bud)+"만원"});
    sl.addEventListener("input",()=>{MS.budget[m.id]=+sl.value;renderMat();const s=$("#mout input");if(s)s.focus();});
    ctr.append(el("div",{class:"field",style:"margin-top:10px"},el("div",{class:"lbl"},el("span",{text:`이 항목에 쓸 수 있는 예산 (${m.needLabel} 기준)`}),sv),sl,

    let tr=el("tr");

      if(r.need){
        const tot=mid*r.need,cov=Math.min(1,bud/tot);
        cls=bud>=tot?"hit":"miss";
        extra=el("td",{"data-label":"필요 총액",class:"need"},
          el("div",{class:"num",text:`${f(Math.round(tot))}만원 (${f(r.need)}${r.unit.replace("만원/","")})`}),
          el("div",{class:"small",text:bud>=tot?"예산 안에서 전량 가능":`예산으로 ${Math.round(cov*100)}%만 충당`}),
          el("div",{class:"cover"},el("b",{class:bud>=tot?"":"part",style:`width:${cov*100}%`})));
      }else extra=el("td",{"data-label":"필요 총액",class:"small need",text:"해당 없음 (가산율)"});
    }
    tr=el("tr",{class:cls},
      el("td",{class:"nm","data-label":"자재",text:r.name}),
      el("td",{class:"num","data-label":"단가"},fr(r.price)+" "+(r.unit.startsWith("%")?"%":r.unit)),
      el("td",{"data-label":"내구성"},r.durability?el("span",{class:"dots",role:"img","aria-label":"내구성 "+r.durability+"/5"},[1,2,3,4,5].map(i=>el("i",{class:i<=r.durability?"on":""}))):el("span",{class:"small",text:"-"})),
      el("td",{"data-label":"관리 메모",text:r.maintenance}),
      el("td",{"data-label":"예산대"},el("span",{class:"tag "+({"가성비":"budget","중급":"mid","고급":"premium"}[r.band]),text:r.band})),

/* ---------- sanity checks ---------- */
function sanity(){
  const T=(o)=>window.__calc(o).total;
  const res=[];
  const a=T({preset:"budget",py:25}),b=T({preset:"mid",py:25}),c=T({preset:"premium",py:25});
  res.push(["고급 > 중급 > 가성비",c>b&&b>a,[a,b,c].map(Math.round)]);
  const base=T({preset:"mid",py:25}),withB=T({preset:"mid",py:25,opts:{balcony:true}});
  const d=withB-base;
  res.push(["확장 on = +350~600(+이윤 범위) 이내",d>=350&&d<=600*1.14,Math.round(d)]);
  const r25=window.__calc({preset:"mid",py:25}),r34=window.__calc({preset:"mid",py:34});
  res.push(["34평 총액>25평, 평당은 더 낮음",r34.total>r25.total&&r34.perPy<r25.perPy,[Math.round(r25.total),Math.round(r34.total),Math.round(r25.perPy),Math.round(r34.perPy)]]);
  res.forEach(([n,ok,v])=>(ok?console.info:console.error)(`[sanity] ${ok?"PASS":"FAIL"} ${n}`,v));
  window.__sanity=res.map(x=>x[1]);
}
