<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>对 연습문제</title>
<style>
  :root {
    --bg: #14161a;
    --card: #1e2127;
    --card-border: #2c3038;
    --text: #e8e9ec;
    --text-dim: #9a9ea8;
    --accent: #6ea8fe;
    --good: #3ecf8e;
    --good-bg: rgba(62, 207, 142, 0.12);
    --bad: #ff6b6b;
    --bad-bg: rgba(255, 107, 107, 0.12);
    --pinyin: #7ee0c3;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  body { padding: 20px 14px 60px; max-width: 640px; margin: 0 auto; }
  h1 {
    font-size: 1.35rem;
    margin: 4px 0 2px;
    line-height: 1.3;
  }
  .subtitle {
    color: var(--text-dim);
    font-size: 0.88rem;
    margin: 0 0 18px;
    line-height: 1.5;
  }
  .progress-wrap {
    position: sticky; top: 0;
    background: var(--bg);
    padding: 10px 0 14px;
    z-index: 5;
  }
  .progress-bar {
    height: 6px;
    background: var(--card-border);
    border-radius: 3px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    width: 0%;
    transition: width 0.3s ease;
  }
  .progress-label {
    font-size: 0.78rem;
    color: var(--text-dim);
    margin-top: 6px;
    font-variant-numeric: tabular-nums;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 18px 16px;
    margin-bottom: 14px;
  }
  .q-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }
  .q-num {
    font-size: 0.78rem;
    color: var(--text-dim);
    font-variant-numeric: tabular-nums;
  }
  .q-tag {
    font-size: 0.7rem;
    color: var(--accent);
    background: rgba(110, 168, 254, 0.12);
    padding: 3px 9px;
    border-radius: 999px;
  }
  .q-prompt {
    font-size: 1rem;
    line-height: 1.55;
    margin-bottom: 14px;
    color: var(--text);
  }
  .option {
    display: block;
    width: 100%;
    text-align: left;
    background: #262a32;
    border: 1px solid var(--card-border);
    border-radius: 10px;
    padding: 14px 14px;
    margin-bottom: 10px;
    color: var(--text);
    font-size: 1.08rem;
    line-height: 1.5;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    min-height: 48px;
  }
  .option .zh { font-size: 1.15rem; }
  .option .py {
    display: block;
    color: var(--pinyin);
    font-size: 0.82rem;
    margin-top: 4px;
    font-family: -apple-system, sans-serif;
  }
  .option:active { transform: scale(0.99); }
  .option.correct {
    background: var(--good-bg);
    border-color: var(--good);
  }
  .option.wrong {
    background: var(--bad-bg);
    border-color: var(--bad);
  }
  .option.disabled { pointer-events: none; opacity: 0.85; }
  .option .mark {
    float: right;
    font-size: 1.1rem;
  }
  .explain {
    margin-top: 10px;
    padding: 12px 14px;
    background: #171a20;
    border-left: 3px solid var(--accent);
    border-radius: 0 8px 8px 0;
    font-size: 0.92rem;
    line-height: 1.6;
    color: var(--text-dim);
    display: none;
  }
  .explain.show { display: block; }
  .explain b { color: var(--text); }
  .result-card {
    background: var(--card);
    border: 1px solid var(--accent);
    border-radius: 14px;
    padding: 26px 18px;
    text-align: center;
    display: none;
  }
  .result-card.show { display: block; }
  .result-score {
    font-size: 2.2rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--accent);
    margin: 6px 0;
  }
  .result-msg {
    color: var(--text-dim);
    font-size: 0.9rem;
    line-height: 1.6;
    margin-bottom: 18px;
  }
  .retry-btn {
    background: var(--accent);
    color: #14161a;
    border: none;
    border-radius: 10px;
    padding: 13px 28px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    min-height: 48px;
  }
  .hint-footer {
    text-align: center;
    color: var(--text-dim);
    font-size: 0.78rem;
    margin-top: 20px;
    line-height: 1.6;
  }
  .start-screen {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 20px;
  }
  .start-btn {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    text-align: left;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 16px 16px;
    color: var(--text);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    gap: 4px;
  }
  .start-btn:active { transform: scale(0.99); }
  .start-btn-title {
    font-size: 1.05rem;
    font-weight: 700;
  }
  .start-btn-desc {
    font-size: 0.82rem;
    color: var(--text-dim);
    line-height: 1.5;
  }
  .start-btn-adv {
    border-color: var(--accent);
    background: rgba(110, 168, 254, 0.08);
  }
  .start-btn-adv .start-btn-title { color: var(--accent); }
</style>
</head>
<body>

<h1>对 연습문제</h1>
<p class="subtitle" id="subtitleText">对는 "~에 대해"의 만능 번역이 아니다. 방향(对他说) · 특정 조합(有兴趣·满意·负责·重要) · "맞다" 3갈래만 성립한다. 기초 8문항 + 심화 7문항(对来说·对于·向·跟·感到·성어) 총 15문항.</p>

<div class="start-screen" id="startScreen">
  <button class="start-btn" id="startAllBtn">
    <span class="start-btn-title">① 처음부터</span>
    <span class="start-btn-desc">기초~심화 전체 15문항</span>
  </button>
  <button class="start-btn start-btn-adv" id="startAdvBtn">
    <span class="start-btn-title">② 심화 문제부터</span>
    <span class="start-btn-desc">기초 8문항은 이미 풀었다면 여기서 바로 — 对来说 · 对于 · 向/跟 경합 · 확장 콜로케이션 · 성어 (7문항)</span>
  </button>
</div>

<div class="progress-wrap" id="progressWrap" style="display:none;">
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  <div class="progress-label" id="progressLabel">0 / 8</div>
</div>

<div id="quiz"></div>

<div class="result-card" id="resultCard">
  <div style="font-size:0.9rem;color:var(--text-dim);">최종 점수</div>
  <div class="result-score" id="resultScore">0 / 8</div>
  <div class="result-msg" id="resultMsg"></div>
  <button class="retry-btn" id="retryBtn">다시 풀기</button>
</div>

<p class="hint-footer">틀린 문항은 나중에 Anki 약점 카드로 만들 수 있다.</p>

<script>
const QUESTIONS = [
  {
    tag: "최소대립쌍",
    prompt: "\"나는 그에게 이 계획에 대해 말했다\" (대상=그, 주제=이 계획)",
    options: [
      { zh: "我对他说了这个计划。", py: "Wǒ duì tā shuōle zhège jìhuà.", correct: true },
      { zh: "我对这个计划说了他。", py: "Wǒ duì zhège jìhuà shuōle tā.", correct: false }
    ],
    explain: "说과 쓰이는 对는 반드시 <b>对+사람(대상)</b>이다. 주제(计划)는 说의 직접 목적어로 그대로 온다. 두 번째 문장은 对 뒤에 주제를 넣은 오류 — 어제의 <b>说对AI</b>와 같은 함정 패턴이다."
  },
  {
    tag: "어순 오류수정",
    prompt: "\"건강이 나에게 중요하다\"",
    options: [
      { zh: "健康对我很重要。", py: "Jiànkāng duì wǒ hěn zhòngyào.", correct: true },
      { zh: "我对健康很重要。", py: "Wǒ duì jiànkāng hěn zhòngyào.", correct: false }
    ],
    explain: "구조는 <b>[사물] 对 [사람] 重要</b> — ~가 ~에게 중요하다. 두 번째 문장은 주어와 대상이 뒤바뀌어 \"내가 건강에게 중요하다\"는 뜻이 되어버린다."
  },
  {
    tag: "번역 함정",
    prompt: "\"이 소설에 대해 이야기해보자\"를 올바르게 번역한 것은?",
    options: [
      { zh: "我们说说这本小说吧。", py: "Wǒmen shuōshuo zhè běn xiǎoshuō ba.", correct: true },
      { zh: "我们对这本小说说说吧。", py: "Wǒmen duì zhè běn xiǎoshuō shuōshuo ba.", correct: false }
    ],
    explain: "说는 주제를 <b>직접 목적어</b>로 받는다 (说说+주제). 对+주제+说 형태는 존재하지 않는다 — 어제의 说对AI 오류와 완전히 같은 함정이다."
  },
  {
    tag: "어순 오류수정",
    prompt: "\"그는 이 결과에 매우 만족한다\"",
    options: [
      { zh: "他对这个结果很满意。", py: "Tā duì zhège jiéguǒ hěn mǎnyì.", correct: true },
      { zh: "他很满意对这个结果。", py: "Tā hěn mǎnyì duì zhège jiéguǒ.", correct: false }
    ],
    explain: "对+대상은 <b>술어(满意) 앞</b>에 온다. 술어 뒤에 对를 놓는 두 번째 문장은 어순 오류다."
  },
  {
    tag: "어순 오류수정",
    prompt: "\"나는 이 일에 책임감이 있다\"",
    options: [
      { zh: "我对这件事很负责。", py: "Wǒ duì zhè jiàn shì hěn fùzé.", correct: true },
      { zh: "我负责对这件事。", py: "Wǒ fùzé duì zhè jiàn shì.", correct: false }
    ],
    explain: "负责도 满意처럼 <b>对+대상이 술어 앞</b>에 온다. 负责 자체가 이미 \"책임지다\"라는 동사라 뒤에 对를 또 붙이면 이중 오류가 된다."
  },
  {
    tag: "최소대립쌍",
    prompt: "\"이 책에 관한 정보\" (명사를 꾸미는 관형어)",
    options: [
      { zh: "关于这本书的信息", py: "guānyú zhè běn shū de xìnxī", correct: true },
      { zh: "对这本书的信息", py: "duì zhè běn shū de xìnxī", correct: false }
    ],
    explain: "명사를 꾸미는 \"~에 관한\"은 <b>关于</b>만 가능하다. 对는 이런 관형어 자리에 들어갈 수 없다."
  },
  {
    tag: "최소대립쌍",
    prompt: "\"나는 그에게 이 소식을 말했다\" (대상=그)",
    options: [
      { zh: "我对他说了这个消息。", py: "Wǒ duì tā shuōle zhège xiāoxi.", correct: true },
      { zh: "我关于他说了这个消息。", py: "Wǒ guānyú tā shuōle zhège xiāoxi.", correct: false }
    ],
    explain: "关于는 문장 맨 앞에서 전체 주제를 여는 전치사다(关于他，我说了这个消息처럼). 술어 바로 앞에서 <b>대상(사람)</b>을 가리키는 자리는 对의 자리다."
  },
  {
    tag: "对/不对",
    prompt: "\"네 말이 맞아\"",
    options: [
      { zh: "你说得对。", py: "Nǐ shuō de duì.", correct: true },
      { zh: "你对说了。", py: "Nǐ duì shuōle.", correct: false }
    ],
    explain: "对의 세 번째 갈래 \"맞다\"는 <b>说得对</b>(정도보어) 또는 <b>说对了</b> 형태로 쓴다. 두 번째 문장은 对를 술어처럼 오용해 문법적으로 성립하지 않는다."
  },
  {
    tag: "심화 · 对来说",
    prompt: "\"그의 입장에서 보면, 돈은 중요하지 않다\" (관점 전체를 여는 표지)",
    options: [
      { zh: "对他来说，钱不重要。", py: "Duì tā lái shuō, qián bú zhòngyào.", correct: true },
      { zh: "对他，钱不重要。", py: "Duì tā, qián bú zhòngyào.", correct: false }
    ],
    explain: "<b>对+대상+来说</b>는 \"~의 입장/관점에서 보면\"이라는 뜻으로 <b>뒤에 오는 절 전체</b>를 감싸는 표지다. 来说 없이 对+대상만 쓰면 그 뒤 술어가 반드시 그 대상을 <b>직접 겨냥</b>해야 한다(对他好·对他重要처럼). 여기서는 钱不重要가 他를 직접 겨냥하지 않고 독립된 주장이므로 来说가 필수 — 어제 배운 술어-겨냥 对와는 다른 갈래다."
  },
  {
    tag: "심화 · 对/对于",
    prompt: "\"그는 나에게 매우 잘해준다\" (사람 사이의 태도·관계)",
    options: [
      { zh: "他对我很好。", py: "Tā duì wǒ hěn hǎo.", correct: true },
      { zh: "他对于我很好。", py: "Tā duìyú wǒ hěn hǎo.", correct: false }
    ],
    explain: "对于는 <b>추상적 사안·주제</b>(问题·现象·情况)를 다룰 때만 쓰는 서면어투 전치사다. <b>사람 사이의 태도·감정</b>(对…好/坏/热情/耐心)은 반드시 순수 <b>对</b>만 쓴다 — 对于我很好는 원어민이 쓰지 않는 조합이다."
  },
  {
    tag: "심화 · 对 vs 向",
    prompt: "\"우리는 그를 본받아 배워야 한다\" (모범으로 삼는 대상)",
    options: [
      { zh: "我们应该向他学习。", py: "Wǒmen yīnggāi xiàng tā xuéxí.", correct: true },
      { zh: "我们应该对他学习。", py: "Wǒmen yīnggāi duì tā xuéxí.", correct: false }
    ],
    explain: "学习의 대상(모범으로 삼는 사람)을 가리킬 때는 <b>向</b>만 쓴다(向他学习·向雷锋学习). 对는 说·满意·负责·重要처럼 <b>정해진 동사·형용사 조합</b>에만 붙는 전치사라 学习와는 결합하지 않는다 — \"对는 만능이 아니다\"의 대표 사례."
  },
  {
    tag: "심화 · 对 vs 跟",
    prompt: "\"나는 그와 이 일을 상의했다\" (쌍방향 행위)",
    options: [
      { zh: "我跟他商量了这件事。", py: "Wǒ gēn tā shāngliangle zhè jiàn shì.", correct: true },
      { zh: "我对他商量了这件事。", py: "Wǒ duì tā shāngliangle zhè jiàn shì.", correct: false }
    ],
    explain: "商量(상의하다)·聊天·合作처럼 <b>쌍방이 함께 하는 행위</b>는 跟/和만 쓴다. 对는 说·抱怨·解释처럼 <b>화자→대상으로 향하는 일방향 행위</b>에만 쓰인다. 商量에 对를 붙이면 방향성 자체가 어긋나는 오류."
  },
  {
    tag: "심화 · 확장 콜로케이션",
    prompt: "\"그는 결과에 실망했다\" (对+대상+感到+감정형용사)",
    options: [
      { zh: "他对结果感到很失望。", py: "Tā duì jiéguǒ gǎndào hěn shīwàng.", correct: true },
      { zh: "他给结果感到很失望。", py: "Tā gěi jiéguǒ gǎndào hěn shīwàng.", correct: false }
    ],
    explain: "<b>对+대상+感到+감정형용사</b>(对…感到失望/满意/惊讶/自豪)는 어제 배운 对+满意/负责 조합의 확장판이다. 给는 수혜·전달의 대상(给他打电话)에 쓰이지 감정이 향하는 대상에는 쓰이지 않는다."
  },
  {
    tag: "심화 · 성어",
    prompt: "\"그에게 아무리 도리를 설명해도 소용없다\"를 관용적으로 표현하면?",
    options: [
      { zh: "跟他说道理，简直是对牛弹琴。", py: "Gēn tā shuō dàoli, jiǎnzhí shì duì niú tán qín.", correct: true },
      { zh: "跟他说道理，简直是对牛说话。", py: "Gēn tā shuō dàoli, jiǎnzhí shì duì niú shuōhuà.", correct: false }
    ],
    explain: "<b>对牛弹琴</b>(소에게 거문고를 타다)은 \"말이 안 통하는 상대에게 애써 설명한다\"는 뜻의 고정 성어다. 구조 자체는 对(소를 향해)+弹(동사)+琴(목적어)로 어제 배운 <b>对의 방향성</b>과 같은 원리지만, 弹琴을 다른 말로 바꾸면(对牛说话) 성어가 깨져 어색한 직역이 된다."
  },
  {
    tag: "심화 · 뉘앙스 비교",
    prompt: "선생님이 학생들 전체에게 공지하듯 말했다: \"내일 시험이 있다\" — 격식 있는 일방향 공지 뉘앙스에 더 맞는 것은?",
    options: [
      { zh: "老师对学生们说：\"明天有考试。\"", py: "Lǎoshī duì xuéshengmen shuō: \"Míngtiān yǒu kǎoshì.\"", correct: true },
      { zh: "老师跟学生们说：\"明天有考试。\"", py: "Lǎoshī gēn xuéshengmen shuō: \"Míngtiān yǒu kǎoshì.\"", correct: false }
    ],
    explain: "이 문항은 <b>둘 다 문법적으로 맞다</b> — 다만 뉘앙스가 다르다. <b>对+대상+说</b>는 화자→대상으로 향하는 <b>격식 있는 일방향 발화</b>(공지·발표)에 어울리고, <b>跟+대상+说</b>는 <b>대화·잡담처럼 쌍방향 뉘앙스</b>가 있는 캐주얼한 어투다. 오답 처리했지만 실제로는 오답이 아니라 \"덜 어울리는 선택\"에 가깝다."
  }
];

const ADVANCED_START = 8; // QUESTIONS[8] = 9번 문항부터 심화

let activeQuestions = QUESTIONS;
let current = 0;
let score = 0;
let answered = false;

const quizEl = document.getElementById('quiz');
const startScreen = document.getElementById('startScreen');
const progressWrap = document.getElementById('progressWrap');
const progressFill = document.getElementById('progressFill');
const progressLabel = document.getElementById('progressLabel');
const resultCard = document.getElementById('resultCard');
const resultScore = document.getElementById('resultScore');
const resultMsg = document.getElementById('resultMsg');
const subtitleText = document.getElementById('subtitleText');

function beginQuiz(fromAdvanced) {
  activeQuestions = fromAdvanced ? QUESTIONS.slice(ADVANCED_START) : QUESTIONS;
  current = 0;
  score = 0;
  subtitleText.textContent = fromAdvanced
    ? '심화 문제부터 시작 — 对来说 · 对于 · 向/跟 경합 · 확장 콜로케이션 · 성어, 총 ' + activeQuestions.length + '문항.'
    : '기초 8문항 + 심화 7문항, 총 ' + activeQuestions.length + '문항.';
  startScreen.style.display = 'none';
  progressWrap.style.display = '';
  renderQuestion();
}

document.getElementById('startAllBtn').addEventListener('click', () => beginQuiz(false));
document.getElementById('startAdvBtn').addEventListener('click', () => beginQuiz(true));

function renderQuestion() {
  answered = false;
  const q = activeQuestions[current];
  progressFill.style.width = (current / activeQuestions.length * 100) + '%';
  progressLabel.textContent = `${current} / ${activeQuestions.length}`;

  let html = `<div class="card">
    <div class="q-meta">
      <span class="q-num">문항 ${current + 1} / ${activeQuestions.length}</span>
      <span class="q-tag">${q.tag}</span>
    </div>
    <div class="q-prompt">${q.prompt}</div>`;

  q.options.forEach((opt, i) => {
    html += `<button class="option" data-idx="${i}">
      <span class="zh">${opt.zh}</span>
      <span class="py">${opt.py}</span>
    </button>`;
  });

  html += `<div class="explain" id="explainBox">${q.explain}</div>
  </div>`;

  quizEl.innerHTML = html;

  document.querySelectorAll('.option').forEach(btn => {
    btn.addEventListener('click', onSelect);
  });
}

function onSelect(e) {
  if (answered) return;
  answered = true;
  const idx = parseInt(e.currentTarget.dataset.idx, 10);
  const q = activeQuestions[current];

  document.querySelectorAll('.option').forEach((btn, i) => {
    btn.classList.add('disabled');
    if (q.options[i].correct) {
      btn.classList.add('correct');
      btn.innerHTML += '<span class="mark">✅</span>';
    } else if (i === idx) {
      btn.classList.add('wrong');
      btn.innerHTML += '<span class="mark">❌</span>';
    }
  });

  if (q.options[idx].correct) score++;

  document.getElementById('explainBox').classList.add('show');

  setTimeout(() => {
    const nextBtn = document.createElement('button');
    nextBtn.className = 'retry-btn';
    nextBtn.style.width = '100%';
    nextBtn.style.marginTop = '14px';
    nextBtn.textContent = (current === activeQuestions.length - 1) ? '결과 보기' : '다음 문항 →';
    nextBtn.addEventListener('click', () => {
      current++;
      if (current >= activeQuestions.length) {
        showResult();
      } else {
        renderQuestion();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    });
    document.querySelector('.card').appendChild(nextBtn);
  }, 100);
}

function showResult() {
  quizEl.innerHTML = '';
  progressFill.style.width = '100%';
  progressLabel.textContent = `${activeQuestions.length} / ${activeQuestions.length}`;
  resultScore.textContent = `${score} / ${activeQuestions.length}`;

  let msg;
  if (score === activeQuestions.length) {
    msg = '对의 방향·특정조합·맞다 갈래는 물론 对来说·对于·向·跟 경합까지 완전히 구분했다. 다음은 실제 작문에서 자연스럽게 나오는지가 관건.';
  } else if (score >= activeQuestions.length - 2) {
    msg = '대부분 잡았다. 틀린 문항의 패턴(어순 vs 콜로케이션 경합)만 한 번 더 짚으면 된다.';
  } else {
    msg = '对의 자리·콜로케이션 규칙이 아직 헷갈린다. 오답 문항 위주로 다시 풀어보자.';
  }
  resultMsg.textContent = msg;
  resultCard.classList.add('show');
}

document.getElementById('retryBtn').addEventListener('click', () => {
  resultCard.classList.remove('show');
  startScreen.style.display = '';
  progressWrap.style.display = 'none';
  subtitleText.textContent = '기초 8문항 + 심화 7문항(对来说·对于·向·跟·感到·성어) 총 15문항.';
  window.scrollTo({ top: 0, behavior: 'smooth' });
});
</script>

</body>
</html>
